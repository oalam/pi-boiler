; Firmware ESP32 — chaudière à granulés.
; Boucle hôte autour du cœur de régulation portable (../controller).

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

; Le cœur C++ est tiré comme bibliothèque locale (controller/library.json).
; Les versions des libs externes sont à figer après le premier build réussi.
lib_deps =
    symlink://../controller
    paulstoffregen/OneWire
    milesburton/DallasTemperature
    mathieucarbou/ESPAsyncWebServer

; Le cœur est écrit en C++17.
build_unflags = -std=gnu++11
build_flags = -std=gnu++17
